[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclecoach-api"
version = "1.0.0"
description = "CycleCoach FastAPI backend — Phase 1 foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",  # sync driver for Alembic migrations (runtime uses asyncpg)
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "pyjwt>=2.8",  # access tokens (HS256); refresh tokens are opaque, not JWT
  "argon2-cffi>=23.1",  # Argon2id password hashing
  "email-validator>=2.0",  # EmailStr validation in auth schemas
  "python-multipart>=0.0.9",  # GPX upload via multipart/form-data (Phase 5)
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# B008 ignored: Depends()/HTTPBearer() in defaults is FastAPI's canonical DI idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
