services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cyclecoach
      POSTGRES_PASSWORD: cyclecoach2026
      POSTGRES_DB: cyclecoach
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
